<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="두 번째 대표 이미지 교체 영역">
  <defs>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#22332f"/>
      <stop offset="1" stop-color="#07110f"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="36%" r="48%">
      <stop stop-color="#6ac9b0" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6ac9b0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#b9ead8" fill-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>
  <g transform="translate(860 480) rotate(28)" fill="none" stroke="#7df2c7">
    <rect x="-260" y="-260" width="520" height="520" stroke-opacity=".45"/>
    <rect x="-175" y="-175" width="350" height="350" stroke-opacity=".3"/>
    <rect x="-90" y="-90" width="180" height="180" stroke-opacity=".7"/>
  </g>
  <path d="M250 850C510 500 730 850 1010 520s350-170 510-360" fill="none" stroke="#7df2c7" stroke-opacity=".42" stroke-width="2"/>
</svg>
