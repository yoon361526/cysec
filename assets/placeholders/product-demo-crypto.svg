      <stop offset=".56" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#17233b"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5ad7ff"/>
